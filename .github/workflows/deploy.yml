name: Deploy

# One job, not one per theme: GitHub bills every job rounded up to the minute
# (docs/ops/ci.md). The Shopify steps run even when the Ghost ones failed, as
# the two jobs did, but only after their own build succeeded.

on:
  # called by gh-release.yml once the release is created
  workflow_call:
    inputs:
      target:
        type: string
        default: both
  workflow_dispatch:
    inputs:
      target:
        description: Which theme to deploy
        type: choice
        options: [both, ghost, shopify]
        default: both

# Reads the repository; the deploys use their own secrets, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    # nothing to do when only Shopify is asked for and it is off
    if: inputs.target != 'shopify' || vars.SHOPIFY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile

      - if: inputs.target != 'shopify'
        run: pnpm --filter mindsers-it build
      - name: Deploy Ghost theme
        if: inputs.target != 'shopify'
        uses: TryGhost/action-deploy-theme@a0ee1147d15641db25681e54549c4db9a53c2629 # v1.6.6
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          file: themes/ghost/dist/mindsers-it.zip

      # off unless the repo variable SHOPIFY_ENABLED is true
      - id: shopify-build
        if: >-
          !cancelled() && steps.install.outcome == 'success'
          && inputs.target != 'ghost' && vars.SHOPIFY_ENABLED == 'true'
        run: pnpm --filter @mindsers/shopify-theme build
      # settings_data.json holds the theme editor's global settings and is never pushed,
      # so the live values stay. Everything else is mirrored from git: editor changes to
      # templates/*.json, sections/*.json and locales/*.json are overwritten, and files
      # created in the editor are deleted, unless they were pulled into git with
      # `pnpm shop:pull` before releasing.
      - name: Deploy Shopify theme
        if: ${{ !cancelled() && steps.shopify-build.outcome == 'success' }}
        # the CLI is the theme's devDependency, installed above; exec runs in
        # themes/shopify
        run: >
          pnpm --filter @mindsers/shopify-theme exec
          shopify theme push --path .
          --theme "$SHOPIFY_THEME_ID"
          --ignore config/settings_data.json
          --allow-live --json
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
          SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_THEME_ID }}
