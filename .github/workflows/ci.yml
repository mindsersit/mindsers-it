name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ghost: ${{ steps.filter.outputs.ghost }}
      shopify: ${{ steps.filter.outputs.shopify }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ghost:
              - 'themes/ghost/**'
              - 'packages/design-system/**'
              - 'pnpm-lock.yaml'
            shopify:
              - 'themes/shopify/**'
              - 'packages/design-system/**'
              - 'pnpm-lock.yaml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  ghost:
    needs: changes
    if: needs.changes.outputs.ghost == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mindsers-it build
      - run: pnpm --filter mindsers-it test:ci

  shopify:
    needs: changes
    if: needs.changes.outputs.shopify == 'true' && hashFiles('themes/shopify/package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mindsers/shopify-theme build
      - run: npm install -g @shopify/cli
      - run: shopify theme check --path themes/shopify --fail-level error
