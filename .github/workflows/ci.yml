# The gate on pull requests, and only there. One job, not four: GitHub bills
# every job rounded up to the minute, and each of these took under 40 s. A new
# push to the same pull request cancels the run it replaces, and a draft runs
# nothing until it is marked ready. Why each shortcut is safe: docs/ops/ci.md.
#
# - Documentation only (Markdown anywhere, or docs/): nothing runs.
# - Otherwise Biome always runs, and each theme is built and checked when its
#   files change, or the design system, the lockfile, the root's configuration
#   or .github/ do.
#
# main is not checked again on its merge commit: that tree is the one its pull
# request's last run verified. The deploy builds both themes from the tag.
name: CI

on:
  pull_request:
    # `ready_for_review`: leaving draft runs the gate a draft's pushes skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    # Nothing that runs reads them: Biome, the builds, gscan and theme check
    # ignore Markdown. GitHub skips the run only when every path matches.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Everything runs: a manual check of a branch, main included.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files through the API

jobs:
  verify:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/design-system/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.node-version'
              - '.github/**'
            ghost:
              - *shared
              - 'themes/ghost/**'
            shopify:
              - *shared
              - 'themes/shopify/**'
      - name: What runs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          GHOST: ${{ steps.filter.outputs.ghost }}
          SHOPIFY: ${{ steps.filter.outputs.shopify }}
        run: |
          set -euo pipefail
          # A manual run has no base: everything runs.
          if [ "$EVENT" != pull_request ]; then GHOST=true; SHOPIFY=true; fi
          # The Shopify theme is checked only while it exists.
          if [ ! -f themes/shopify/package.json ]; then SHOPIFY=false; fi
          echo "ghost=$GHOST" >> "$GITHUB_OUTPUT"
          echo "shopify=$SHOPIFY" >> "$GITHUB_OUTPUT"
          echo "::notice::ghost=$GHOST shopify=$SHOPIFY"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The release script's own tests (scripts/release.mjs), a second at most.
      - run: pnpm test:scripts
      - if: steps.scope.outputs.ghost == 'true'
        name: Build and check the Ghost theme
        run: |
          set -euo pipefail
          pnpm --filter mindsers-it build
          pnpm --filter mindsers-it test:ci
      - if: steps.scope.outputs.shopify == 'true'
        name: Build and check the Shopify theme
        run: |
          set -euo pipefail
          pnpm --filter @mindsers/shopify-theme build
          # the CLI is a devDependency of the theme: locked and cached by pnpm
          pnpm --filter @mindsers/shopify-theme check
